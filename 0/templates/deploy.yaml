kind: Deployment
apiVersion: apps/v1
metadata:
  name: mariahi-workbench
  namespace: mariahi-lab-workbench
  labels:
    app: mariahi-workbench
    app.kubernetes.io/instance: mariahi-workbench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariahi-workbench
  template:
    metadata:
      labels:
        app: mariahi-workbench
    spec:
      containers:
      - name: workbench
        image: 'quay.apps.hlab.linsoft.local/15ml/lab-workbench:0.0.1'
        ports:
        - containerPort: 22
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        env:
        - name: TZ
          value: Africa/Tunis
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: PUBLIC_KEY
          value: "ssh-rsa  root@workbench-k8s-0"
        # - name: PUBLIC_KEY_FILE
        #   value: "/path/to/file"
        - name: SUDO_ACCESS
          value: "false"
        - name: PASSWORD_ACCESS
          value: "true"
        - name: USER_NAME
          value: labuser
        - name: USER_PASSWORD
          value: "password"
        # - name: USER_PASSWORD_FILE
        #   value: "/path/to/file"
        - name: LOG_STDOUT
          value: ""
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      imagePullSecrets:
      - name: lab-registry-secret
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
